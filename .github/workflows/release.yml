# Builds Relay for every platform and attaches the results to a draft release.
#
# Linux and macOS packages can only be produced on those systems, which is why this runs
# on three runners; the Android build runs alongside them on Linux.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows gets both: the zip for people who would rather not install anything,
          # and the installer for people who would.
          - os: windows-latest
            tasks: ':desktop:createDistributable :desktop:packageExe'
            artifact: Relay-windows-x64
            path: |
              desktop/build/compose/binaries/main/app
              desktop/build/compose/binaries/main/exe
          - os: ubuntu-latest
            tasks: ':desktop:packageDeb :desktop:packageRpm'
            artifact: Relay-linux
            path: |
              desktop/build/compose/binaries/main/deb
              desktop/build/compose/binaries/main/rpm
          - os: macos-latest
            tasks: ':desktop:packageDmg'
            artifact: Relay-macos
            path: desktop/build/compose/binaries/main/dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # jpackage builds the .exe with WiX 3, and the runner image no longer always
      # carries it. WiX 4 and 5 are not a substitute: jpackage only speaks to 3.
      - name: WiX 3 for the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX already present"
          } else {
            $zip = "$env:RUNNER_TEMP\wix.zip"
            $dir = "$env:RUNNER_TEMP\wix"
            Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            Write-Host "WiX unpacked to $dir"
          }
      # rpmbuild is not in the Ubuntu runner image, and jpackage shells out to it.
      - name: rpmbuild for the Linux package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build ${{ matrix.artifact }}
        run: ./gradlew ${{ matrix.tasks }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew test :app:testDebugUnitTest
      # The upload key never leaves the maintainer's machine: CI produces an unsigned
      # bundle, which is signed locally before it goes to Google Play.
      - name: Build release bundle
        run: ./gradlew :app:bundleRelease :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-android
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
